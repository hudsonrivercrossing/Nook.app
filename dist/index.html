<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nook，Mac 上的白板，文件归你。">
<meta name="theme-color" content="#F5F4F0">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Nook — 一处安静的地方，留给少数重要的项目">
<meta property="og:description" content="Mac 上的白板，文件归你。">
<meta property="og:image" content="https://hudsonrivercrossing.github.io/Nook.app/assets/nook-icon.png">
<title>Nook — 一处安静的地方</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/nook-icon.png">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/wenkai-screen.woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=1.8.0">
</head>
<body>
<header class="header wrap">
  <a class="brand" href="#" aria-label="Nook">
    <img src="assets/nook-icon.png" width="40" height="40" alt="">
    <span>Nook</span>
  </a>
  <div class="header-end">
  <nav class="site-nav"><a href="blog/" data-t="blog">博客</a></nav>
  <label class="language">
    <span class="visually-hidden" data-t="langLabel">语言</span>
    <select id="language">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="ja">日本語</option>
    </select>
  </label>
  </div>
</header>

<main>
  <section class="hero wrap">
    <div class="hero-copy intro">
      <h1 data-t="headline">一处安静的地方，<br>留给少数重要的项目。</h1>
      <p class="lede" data-t="lede">Mac 上的白板，文件归你。</p>
      <a class="button" href="https://github.com/hudsonrivercrossing/Nook.app/releases/latest/download/Nook.dmg">
        <span data-t="download">下载 macOS 版</span><span aria-hidden="true">↓</span>
      </a>
    </div>

    <figure class="scene intro">
      <div class="board" id="board" role="img" aria-label="">
        <div class="crumb"><span data-t="home">主页</span> / <b id="board-title">旅行 · 京都</b></div>

        <div class="pane trip on" data-pane="trip">
          <svg class="wires" aria-hidden="true"><path class="wire" pathLength="1"/><path class="head" pathLength="1"/></svg>
          <span class="wire-label" data-s="trip.arrow"></span>
          <div class="stack">
          <div class="region step">
            <div class="region-title"><i></i><span data-s="trip.region"></span></div>
            <div class="card text step note1" data-type="trip.note1"></div>
            <div class="card text step note2" data-type="trip.note2"></div>
          </div>
            <div class="card list step">
              <p class="done"><span class="box">✓</span><span data-s="trip.todo1"></span></p>
              <p><span class="box"></span><span data-s="trip.todo2"></span></p>
              <p><span class="box"></span><span data-s="trip.todo3"></span></p>
            </div>
          </div>
          <div class="side">
            <div class="card place step">
              <div class="map"><span class="pin"></span></div>
              <div class="meta"><b data-s="trip.place"></b><span data-s="trip.placeKind"></span></div>
              <div class="pending"><span class="well"></span><span class="url">maps.apple.com/?q=…</span><span class="skel"></span></div>
            </div>
            <div class="card video step">
              <div class="media"><span class="glyph"></span></div>
              <div class="meta"><b data-s="trip.video"></b><span>VIDEO · YouTube</span></div>
              <div class="pending"><span class="well"><span class="glyph"></span></span><span class="url">youtube.com/watch?v=…</span><span class="skel"></span></div>
            </div>
          </div>
        </div>

        <div class="pane moving" data-pane="moving">
          <div class="columns">
            <div class="column step c1">
              <div class="column-title" data-s="moving.todo"></div>
              <div class="card text mover step"><span class="box"><span>✓</span></span><span data-s="moving.m1"></span></div>
              <div class="card text step m2" data-s="moving.m2"></div>
              <div class="card text step m3" data-s="moving.m3"></div>
            </div>
            <div class="column done-col step c2">
              <div class="column-title" data-s="moving.done"></div>
              <div class="slot" aria-hidden="true"></div>
              <div class="card text done-card step"><span class="box">✓</span><span data-s="moving.d1"></span></div>
            </div>
          </div>
          <div class="side">
            <div class="card plan step">
              <svg class="floor" viewBox="0 0 140 92" aria-hidden="true">
                <rect class="room-tint" x="79" y="41" width="57" height="47"/>
                <g class="furniture">
                  <rect x="8" y="8" width="26" height="34" rx="2"/><path d="M8 15h26"/>
                  <rect x="7" y="55" width="12" height="28" rx="5"/><circle cx="27" cy="58" r="3.5"/>
                  <rect x="82" y="7" width="34" height="8" rx="1"/><circle cx="90" cy="11" r="2"/><circle cx="98" cy="11" r="2"/>
                  <rect x="98" y="77" width="32" height="8" rx="2.5"/><rect x="103" y="58" width="20" height="12" rx="1.5"/>
                </g>
                <g class="fridge"><rect x="120" y="7" width="13" height="11" rx="1"/><path class="dim" d="M120 23h13M120 21v4M133 21v4"/><text x="126.5" y="32">62</text></g>
                <path class="walls" d="M3 3H137V89H3Z M78 3V50 M78 62V89 M3 50H40 M52 50H78 M34 50V89 M78 40H96 M108 40H137"/>
                <path class="gap" d="M48 89H62 M20 3H50 M137 55V78 M100 3H118"/>
                <path class="window" d="M20 2H50M20 4H50 M136 55V78M138 55V78"/>
                <path class="door" d="M40 50A12 12 0 0 1 52 62M52 50V62 M78 50A12 12 0 0 0 90 62M78 62H90 M96 40A12 12 0 0 0 108 52M108 40V52 M48 89A14 14 0 0 1 62 75M62 89V75"/>
              </svg>
              <span class="caption" data-s="moving.plan"></span>
            </div>
            <div class="card boardcard step">
              <svg class="mini" viewBox="0 0 140 52" aria-hidden="true">
                <rect class="mg" x="0" y="0" width="140" height="52" rx="5"/>
                <rect class="mr" x="7" y="7" width="58" height="38" rx="5"/>
                <rect class="mc" x="12" y="15" width="22" height="12" rx="1.5"/><rect class="mc" x="38" y="15" width="22" height="20" rx="1.5"/><rect class="mc" x="12" y="30" width="22" height="9" rx="1.5"/>
                <rect class="mi" x="74" y="7" width="30" height="22" rx="1.5"/>
                <rect class="mc" x="108" y="7" width="25" height="13" rx="1.5"/><rect class="mc" x="108" y="24" width="25" height="9" rx="1.5"/>
                <rect class="mc" x="74" y="37" width="30" height="9" rx="1.5"/>
              </svg>
              <b class="bc-title" data-s="moving.boardCard"></b>
              <span class="bc-meta" data-s="moving.boardMeta"></span>
            </div>
          </div>
        </div>

        <div class="pane research" data-pane="research">
          <svg class="wires" aria-hidden="true"><path class="wire" pathLength="1"/><path class="head" pathLength="1"/></svg>
          <span class="wire-label" data-s="research.arrow"></span>
          <div class="stack">
            <div class="card text step lit" data-type="research.lit"></div>
            <div class="card text step question" data-type="research.question"></div>
          </div>
          <div class="stack">
            <div class="card web step">
              <div class="web-head"><span class="favicon">W</span><span class="url">en.wikipedia.org</span></div>
              <div class="meta"><b>Third place</b><span>WEB · Wikipedia</span></div>
              <div class="pending"><span class="url">en.wikipedia.org/wiki/Third_place</span><span class="skel"></span></div>
            </div>
            <div class="card text step field" data-type="research.field"></div>
          </div>
          <div class="palette" aria-hidden="true">
            <div class="field-row"><span class="lens"></span><span class="query" data-type="research.query"></span><span class="caret"></span></div>
            <div class="result there"><span class="what" data-s="trip.note2"></span><span class="where" data-s="trip.board"></span><kbd>↵</kbd></div>
            <div class="result here"><span class="what" data-s="research.field"></span><span class="where" data-s="research.board"></span></div>
          </div>
        </div>

        <div class="pane reading" data-pane="reading">
          <svg class="wires" aria-hidden="true"><path class="wire" pathLength="1"/><path class="head" pathLength="1"/></svg>
          <span class="wire-label" data-s="reading.arrow"></span>
          <div class="stack">
            <div class="card book step">
              <div class="book-cover"><img src="https://images-na.ssl-images-amazon.com/images/P/0061673730.01.L.jpg" alt="" width="54" height="78" referrerpolicy="no-referrer" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='https://books.google.com/books/content?vid=ISBN9780061673733&amp;printsec=frontcover&amp;img=1&amp;zoom=1'}else{this.parentNode.classList.add('drawn')}"><span class="drawn-title">Zen and the Art of Motorcycle Maintenance</span></div>
              <div class="meta"><b>Zen and the Art of Motorcycle Maintenance</b><span class="by">Robert M. Pirsig · 1974</span><span>BOOK · Goodreads</span></div>
              <div class="pending"><span class="url">goodreads.com/book/show/629…</span><span class="skel"></span></div>
            </div>
            <div class="card text step own" data-type="reading.own"></div>
          </div>
          <div class="region step">
            <div class="region-title"><i></i><span data-s="reading.region"></span></div>
            <div class="card text step hl hl1" data-s="reading.hl1"></div>
            <div class="card text step hl hl2" data-s="reading.hl2"></div>
          </div>
        </div>

        <div class="pane collection" data-pane="collection">
          <svg class="wires" aria-hidden="true"><path class="wire" pathLength="1"/><path class="head" pathLength="1"/></svg>
          <span class="wire-label" data-s="col.arrow"></span>
          <div class="films">
            <div class="region nolan step"><div class="region-title"><i></i><span data-s="col.region"></span></div></div>
              <div class="card film step f1">
                <div class="poster"><img src="https://upload.wikimedia.org/wikipedia/en/2/2e/Inception_%282010%29_theatrical_poster.jpg" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('drawn')"></div>
                <div class="meta"><b data-s="col.f1"></b><span class="by">2010</span><span>FILM · Wikipedia</span></div>
                <div class="pending"><span class="well"></span><span class="url">en.wikipedia.org/wiki/Inception</span><span class="skel"></span></div>
              </div>
              <div class="card film step f2">
                <div class="poster"><img src="https://upload.wikimedia.org/wikipedia/en/c/c7/Memento_poster.jpg" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('drawn')"></div>
                <div class="meta"><b data-s="col.f2"></b><span class="by">2000</span><span>FILM · Wikipedia</span></div>
                <div class="pending"><span class="well"></span><span class="url">en.wikipedia.org/wiki/Memento_(film)</span><span class="skel"></span></div>
              </div>
              <div class="card film step f3">
                <div class="poster"><img src="https://upload.wikimedia.org/wikipedia/en/7/76/Shutterislandposter.jpg" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('drawn')"></div>
                <div class="meta"><b data-s="col.f3"></b><span class="by">2010</span><span>FILM · Wikipedia</span></div>
                <div class="pending"><span class="well"></span><span class="url">en.wikipedia.org/wiki/Shutter_Island_(film)</span><span class="skel"></span></div>
              </div>
              <div class="card film step f4">
                <div class="poster"><img src="https://upload.wikimedia.org/wikipedia/en/0/05/Gone_Girl_Poster.jpg" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('drawn')"></div>
                <div class="meta"><b data-s="col.f4"></b><span class="by">2014</span><span>FILM · Wikipedia</span></div>
                <div class="pending"><span class="well"></span><span class="url">en.wikipedia.org/wiki/Gone_Girl_(film)</span><span class="skel"></span></div>
              </div>
          </div>
          <div class="card text step cnote" data-type="col.note"></div>
        </div>

        <div class="pill" aria-hidden="true">
          <i data-tool="text"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg></i>
          <i data-tool="link"><svg viewBox="0 0 16 16"><path d="M7 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-.8.8M9 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l.8-.8"/></svg></i>
          <i data-tool="image"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M3 12l3.5-3.5 2.5 2.5 1.5-1.5 2.5 2.5"/></svg></i>
          <i data-tool="region"><svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5" stroke-dasharray="2 1.6"/></svg></i>
          <i data-tool="column"><svg viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="4.5" rx="1"/><rect x="3" y="9" width="10" height="4.5" rx="1"/></svg></i>
          <i data-tool="board"><svg viewBox="0 0 16 16"><rect x="2.5" y="4.5" width="8.5" height="9" rx="1.2"/><path d="M5 2.5h7a1.5 1.5 0 0 1 1.5 1.5v7"/></svg></i>
          <i data-tool="connect"><svg viewBox="0 0 16 16"><path d="M4 12L12 4M7 4h5v5"/></svg></i>
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="示例白板">
        <button type="button" role="tab" data-scene="trip" aria-selected="true" data-t="trip">旅行</button>
        <button type="button" role="tab" data-scene="moving" aria-selected="false" data-t="moving">规划</button>
        <button type="button" role="tab" data-scene="research" aria-selected="false" data-t="research">研究</button>
        <button type="button" role="tab" data-scene="reading" aria-selected="false" data-t="reading">读书</button>
        <button type="button" role="tab" data-scene="collection" aria-selected="false" data-t="collection">收藏</button>
      </div>
    </figure>
  </section>

  <section class="features wrap">
    <article>
      <div class="sketch collect" aria-hidden="true">
        <div class="paste"><span class="key">⌘V</span><span class="paste-url">youtube.com/watch?v=…</span></div>
        <svg class="sk-arrow" viewBox="0 0 60 44"><path d="M6 4 C 8 26, 26 38, 52 38"/><path d="M46 33 L53 38 L46 43"/></svg>
        <div class="sk-card">
          <span class="sk-media"><i></i></span>
          <span class="sk-meta"><b data-t="sk1">秋天的京都</b><span>VIDEO · YouTube</span></span>
        </div>
      </div>
      <h2 data-t="v1t">收集</h2>
      <p data-t="v1">粘贴链接、拖入图片，就是一张卡片。</p>
    </article>
    <article>
      <div class="sketch arrange" aria-hidden="true">
        <div class="sk-region"><span class="sk-title"><i></i><span data-t="sk2r">第二天</span></span><span class="sk-note"></span><span class="sk-note short"></span></div>
        <div class="sk-link"><svg viewBox="0 0 64 30"><path d="M2 15 C 20 15, 40 15, 58 15"/><path d="M52 10 L59 15 L52 20"/></svg><span class="sk-label" data-t="sk2a">去之前先看</span></div>
        <div class="sk-column"><span class="sk-title plain" data-t="sk2c">要办</span><span class="sk-note"></span><span class="sk-note"></span><span class="sk-note short"></span></div>
      </div>
      <h2 data-t="v2t">整理</h2>
      <p data-t="v2">区域、栏和箭头，让关系一目了然。</p>
    </article>
    <article>
      <div class="sketch keep" aria-hidden="true">
        <div class="finder">
          <div class="fbar"><i></i><i></i><i></i><span class="ficon folder"></span><span>Dropbox › Nook</span></div>
          <div class="files">
            <span class="doc"><span class="thumb t1"><i></i><i></i><i></i></span><span class="name" data-sb="trip.board"></span></span>
            <span class="doc"><span class="thumb t2"><i></i><i></i><i></i></span><span class="name" data-sb="moving.board"></span></span>
            <span class="doc"><span class="thumb t3"><i></i><i></i><i></i></span><span class="name" data-sb="research.board"></span></span>
          </div>
        </div>
      </div>
      <h2 data-t="v3t">归你</h2>
      <p data-t="v3">白板是你文件夹里的普通文件。没有账号，不收集数据。</p>
    </article>
  </section>
</main>

<footer class="footer wrap">
  <span>Nook 1.0.0</span>
  <a href="https://github.com/hudsonrivercrossing/Nook.app">GitHub</a>
</footer>
<script src="app.js?v=1.8.2"></script>
</body>
</html>
