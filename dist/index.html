<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nook，Mac 上的白板，文件归你。">
<meta name="theme-color" content="#EAE8E3">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Nook — 一处安静的地方，留给少数真正重要的项目">
<meta property="og:description" content="Mac 上的白板。链接、图片、文字，放在你自己的文件夹里。">
<meta property="og:image" content="https://hudsonrivercrossing.github.io/Nook.app/assets/nook-icon.png">
<title>Nook — 一处安静的地方</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/nook-icon.png">
<link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
<header class="header wrap">
  <a class="brand" href="#" aria-label="Nook">
    <img src="assets/nook-icon.png" width="32" height="32" alt="">
    <span>Nook</span>
  </a>
  <button id="language" class="language" type="button" aria-label="Switch to English">EN</button>
</header>

<main>
  <section class="hero wrap">
    <div class="hero-copy intro">
      <h1 data-i18n="headline">一处安静的地方，<br>留给少数重要的项目。</h1>
      <p class="lede" data-i18n="lede">Mac 上的白板，文件归你。</p>
      <a class="button" href="https://github.com/hudsonrivercrossing/Nook.app/releases/latest/download/Nook.dmg">
        <span data-i18n="download">下载 macOS 版</span><span aria-hidden="true">↓</span>
      </a>
      <p class="hero-note" data-i18n="requirements">1.0 · macOS 15 或更高</p>
    </div>

    <div class="board intro" role="img" aria-label="一块 Nook 白板：一个区域里有几张文字卡片和一张清单，旁边是一张链接卡片，箭头把它们连起来" data-i18n-attr="aria-label:boardLabel">
      <div class="crumb"><span data-i18n="crumbHome">主页</span> / <b data-i18n="crumbBoard">京都之旅</b></div>
      <div class="canvas">
      <div class="region">
        <div class="region-title"><i></i><span data-i18n="region">第二天</span></div>
        <div class="card text" data-i18n="card1">7:00 去伏见稻荷，人还少。</div>
        <div class="card text" data-i18n="card2">午饭锦市场，下午清水寺。</div>
        <div class="card list">
          <p class="done"><span class="box">✓</span><span data-i18n="todo1">订好民宿</span></p>
          <p><span class="box"></span><span data-i18n="todo2">JR Pass</span></p>
          <p><span class="box"></span><span data-i18n="todo3">晚上：岚山竹林</span></p>
        </div>
      </div>
      <svg class="arrow" viewBox="0 0 120 70" aria-hidden="true"><path d="M4 60 C 50 60, 70 12, 112 12"/><path class="head" d="M104 6 L114 12 L104 18"/></svg>
      <div class="card link">
        <div class="media"><span class="play"></span></div>
        <div class="meta">
          <b data-i18n="linkTitle">秋天的京都：枫叶地图</b>
          <span>VIDEO · YouTube</span>
        </div>
      </div>
      </div>
      <div class="pill" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>

  <section class="features wrap" aria-label="功能" data-i18n-attr="aria-label:features">
    <p data-i18n="f1">粘贴链接，就是一张卡片。</p>
    <p data-i18n="f2">区域、栏和箭头，把东西理清楚。</p>
    <p data-i18n="f3">没有账号，不收集数据。放进 Dropbox，多台 Mac 一起用。</p>
  </section>
</main>

<footer class="footer wrap">
  <span>Nook 1.0.0</span>
  <span class="footer-links"><a href="https://github.com/hudsonrivercrossing/Nook.app/releases/latest/download/Nook.dmg.sha256">SHA-256</a><a href="https://github.com/hudsonrivercrossing/Nook.app">GitHub</a></span>
</footer>
<script src="app.js?v=1.0.0"></script>
</body>
</html>
